# =========================================================
# PAYFLOW AI — PART 8
# GITHUB ACTIONS CONTINUOUS INTEGRATION
#
# Repository layout:
#
# mlflow-course/
# │
# ├── .github/
# │   └── workflows/
# │       └── ci.yml
# │
# └── payflow-ai/
#     ├── requirements-ci.txt
#     ├── docker-compose.yml
#     ├── docker/
#     ├── src/
#     └── scripts/
#
#
# IMPORTANT:
#
# GitHub checks out the repository at:
#
#   /home/runner/work/mlflow-course/mlflow-course
#
# But the PayFlow application lives in:
#
#   payflow-ai/
#
# Therefore:
#
#   setup-python cache path
#       -> payflow-ai/requirements-ci.txt
#
#   shell commands
#       -> working-directory: payflow-ai
#
# =========================================================


name: PayFlow CI


# =========================================================
# 1. TRIGGERS
# =========================================================

on:

  pull_request:

    branches:
      - main


  push:

    branches:
      - main


  workflow_dispatch:


# =========================================================
# 2. MINIMUM TOKEN PERMISSIONS
# =========================================================

permissions:

  contents: read


# =========================================================
# 3. CANCEL OLD CI RUNS
# =========================================================

concurrency:

  group: payflow-ci-${{ github.ref }}

  cancel-in-progress: true


# =========================================================
# 4. JOB
# =========================================================

jobs:

  ci:

    name: Validate PayFlow MLOps Platform

    runs-on: ubuntu-latest

    timeout-minutes: 35


    # =====================================================
    # IMPORTANT
    #
    # Every `run:` command executes inside payflow-ai.
    #
    # GitHub actions themselves such as setup-python still
    # resolve paths relative to repository root.
    # =====================================================

    defaults:

      run:

        working-directory: payflow-ai


    env:

      PYTHONPATH:
        src

      PAYFLOW_DOCKER_MLFLOW_URI:
        http://127.0.0.1:5050

      PAYFLOW_LOKI_URL:
        http://127.0.0.1:3100

      PAYFLOW_GRAFANA_URL:
        http://127.0.0.1:3000

      PAYFLOW_ENV_FILE:
        .env.ci


    steps:

      # ===================================================
      # 5. CHECKOUT
      # ===================================================

      - name: Checkout repository

        uses: actions/checkout@v7


      # ===================================================
      # 6. SHOW REPOSITORY STRUCTURE
      #
      # Override working-directory because we want to show
      # the repository root first.
      # ===================================================

      - name: Show repository structure

        working-directory: .

        run: |
          echo "Repository root:"
          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "PayFlow directory:"
          ls -la payflow-ai

          echo
          echo "PayFlow Docker files:"
          find payflow-ai/docker \
            -maxdepth 5 \
            -type f \
            | sort


      # ===================================================
      # 7. SET UP PYTHON
      #
      # cache-dependency-path is relative to repository root,
      # NOT the defaults.run.working-directory.
      # ===================================================

      - name: Set up Python

        uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: pip

          cache-dependency-path:
            payflow-ai/requirements-ci.txt


      # ===================================================
      # 8. PYTHON VERSION
      # ===================================================

      - name: Show Python version

        run: |
          python --version
          pip --version


      # ===================================================
      # 9. INSTALL CI DEPENDENCIES
      #
      # Because working-directory is payflow-ai:
      #
      #   requirements-ci.txt
      #
      # resolves correctly.
      # ===================================================

      - name: Install CI dependencies

        run: |
          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements-ci.txt


      # ===================================================
      # 10. CREATE CI ENV FILE
      #
      # Local .env.docker is intentionally not required
      # inside GitHub Actions.
      #
      # CI gets an ephemeral .env.ci.
      # ===================================================

      - name: Create CI environment file

        shell: bash

        run: |
          cat > "${PAYFLOW_ENV_FILE}" <<'EOF'
          POSTGRES_DB=mlflow
          POSTGRES_USER=mlflow
          POSTGRES_PASSWORD=payflow_ci_postgres_12345
          POSTGRES_HOST_PORT=5433

          MINIO_ROOT_USER=payflowci
          MINIO_ROOT_PASSWORD=payflow_ci_minio_12345
          MLFLOW_BUCKET=mlflow
          MINIO_API_PORT=9000
          MINIO_CONSOLE_PORT=9001

          MLFLOW_HOST_PORT=5050
          FASTAPI_HOST_PORT=8001

          GRAFANA_HOST_PORT=3000
          LOKI_HOST_PORT=3100

          OTEL_GRPC_HOST_PORT=4317
          OTEL_HTTP_HOST_PORT=4318

          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=payflow_ci_grafana_12345

          PAYFLOW_TRACE_EXPERIMENT=payflow-production-traces
          PAYFLOW_ENVIRONMENT=ci
          EOF


      # ===================================================
      # 11. VERIFY CI FILES
      # ===================================================

      - name: Verify required project files

        shell: bash

        run: |
          echo "Current directory:"
          pwd

          echo
          echo "Checking files..."

          test -f requirements-ci.txt
          test -f docker-compose.yml

          test -f docker/mlflow/Dockerfile

          test -f docker/fastapi/Dockerfile
          test -f docker/fastapi/requirements.txt

          test -f docker/loki/loki-config.yaml

          test -f docker/otel/otel-collector-config.yaml

          test -f \
            docker/grafana/provisioning/datasources/datasources.yaml

          test -f scripts/16_test_docker_mlflow.py

          test -f "${PAYFLOW_ENV_FILE}"

          echo
          echo "All required files exist."


      # ===================================================
      # 12. PYTHON SYNTAX VALIDATION
      # ===================================================

      - name: Compile PayFlow Python source

        run: |
          python -m compileall \
            src \
            scripts


      # ===================================================
      # 13. SHOW DOCKER VERSIONS
      # ===================================================

      - name: Show Docker versions

        run: |
          docker --version

          docker compose version


      # ===================================================
      # 14. VALIDATE DOCKER COMPOSE
      # ===================================================

      - name: Validate Docker Compose

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            config \
            --quiet


      # ===================================================
      # 15. SHOW COMPOSE SERVICES
      # ===================================================

      - name: Show Compose services

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            config \
            --services


      # ===================================================
      # 16. BUILD CUSTOM PAYFLOW IMAGES
      # ===================================================

      - name: Build Docker images

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            build


      # ===================================================
      # 17. START CORE MLFLOW INFRASTRUCTURE
      #
      # FastAPI intentionally stays out of CI for now.
      #
      # Fresh GitHub Registry has no @champion.
      # ===================================================

      - name: Start MLflow infrastructure

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            up -d \
            postgres \
            minio \
            minio-init \
            mlflow


      # ===================================================
      # 18. SHOW CORE STATUS
      # ===================================================

      - name: Show core infrastructure status

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a


      # ===================================================
      # 19. WAIT FOR MLFLOW
      # ===================================================

      - name: Wait for MLflow

        shell: bash

        run: |
          echo "Waiting for MLflow..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:5050/health
            then

              echo
              echo "MLflow is healthy."

              exit 0

            fi

            echo \
              "MLflow not ready. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "MLflow failed to become healthy."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            mlflow

          exit 1


      # ===================================================
      # 20. MLFLOW STORAGE SMOKE TEST
      #
      # Proves:
      #
      # metadata
      #     -> PostgreSQL
      #
      # artifacts
      #     -> MinIO
      # ===================================================

      - name: Verify PostgreSQL and MinIO through MLflow

        env:

          MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD:
            "false"

          MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD:
            "false"

        run: |
          python scripts/16_test_docker_mlflow.py


      # ===================================================
      # 21. POSTGRESQL METADATA CHECK
      # ===================================================

      - name: Verify smoke experiment in PostgreSQL

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            exec \
            -T \
            postgres \
            psql \
            -U mlflow \
            -d mlflow \
            -P pager=off \
            -c "
              SELECT
                experiment_id,
                name,
                artifact_location
              FROM experiments
              ORDER BY experiment_id;
            "


      # ===================================================
      # 22. ASSERT SMOKE EXPERIMENT EXISTS
      # ===================================================

      - name: Assert smoke experiment exists

        shell: bash

        run: |
          RESULT="$(
            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U mlflow \
              -d mlflow \
              -t \
              -A \
              -c "
                SELECT name
                FROM experiments
                WHERE name = 'payflow-docker-smoke';
              "
          )"

          echo \
            "PostgreSQL result: ${RESULT}"


          if [[ "${RESULT}" != *"payflow-docker-smoke"* ]]
          then

            echo \
              "Smoke experiment was not found."

            exit 1

          fi


          echo \
            "PostgreSQL metadata verification passed."


      # ===================================================
      # 23. START OBSERVABILITY STACK
      # ===================================================

      - name: Start observability infrastructure

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            up -d \
            loki \
            otel-collector \
            grafana


      # ===================================================
      # 24. WAIT FOR LOKI
      # ===================================================

      - name: Wait for Loki

        shell: bash

        run: |
          echo "Waiting for Loki..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3100/ready
            then

              echo
              echo "Loki is ready."

              exit 0

            fi

            echo \
              "Loki not ready. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "Loki did not become ready."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            loki

          exit 1


      # ===================================================
      # 25. WAIT FOR GRAFANA
      # ===================================================

      - name: Wait for Grafana

        shell: bash

        run: |
          echo "Waiting for Grafana..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/api/health
            then

              echo
              echo "Grafana is healthy."

              exit 0

            fi

            echo \
              "Grafana not ready. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "Grafana did not become healthy."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            grafana

          exit 1


      # ===================================================
      # 26. VERIFY OTEL CONTAINER
      # ===================================================

      - name: Verify OpenTelemetry Collector

        shell: bash

        run: |
          STATUS="$(
            docker inspect \
              -f '{{.State.Status}}' \
              payflow-otel-collector
          )"

          echo \
            "OTel Collector status: ${STATUS}"


          if [[ "${STATUS}" != "running" ]]
          then

            docker logs \
              payflow-otel-collector

            exit 1

          fi


      # ===================================================
      # 27. VERIFY GRAFANA -> LOKI PROVISIONING
      # ===================================================

      - name: Verify Grafana Loki datasource

        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --user \
            "admin:payflow_ci_grafana_12345" \
            http://127.0.0.1:3000/api/datasources/name/Loki


      # ===================================================
      # 28. FINAL STATUS
      # ===================================================

      - name: Show Docker status

        if: always()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              ps \
              -a || true

          else

            echo \
              "CI environment file not yet created."

            docker ps \
              -a || true

          fi


      # ===================================================
      # 29. MLFLOW FAILURE LOGS
      # ===================================================

      - name: Show MLflow logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              mlflow || true

          fi


      # ===================================================
      # 30. MINIO FAILURE LOGS
      # ===================================================

      - name: Show MinIO logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              minio || true

          fi


      # ===================================================
      # 31. LOKI FAILURE LOGS
      # ===================================================

      - name: Show Loki logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              loki || true

          fi


      # ===================================================
      # 32. OTEL FAILURE LOGS
      # ===================================================

      - name: Show OpenTelemetry logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              otel-collector || true

          fi


      # ===================================================
      # 33. GRAFANA FAILURE LOGS
      # ===================================================

      - name: Show Grafana logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              grafana || true

          fi


      # ===================================================
      # 34. CLEANUP
      # ===================================================

      - name: Stop CI containers

        if: always()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              down \
              --remove-orphans || true

          fi