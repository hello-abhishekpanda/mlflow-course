# =========================================================
# PAYFLOW AI — PART 8
# GITHUB ACTIONS CONTINUOUS INTEGRATION
#
# This workflow validates:
#
#   Python source
#   Docker Compose syntax
#   Docker image builds
#   PostgreSQL
#   MinIO
#   MLflow Tracking Server
#   MLflow PostgreSQL backend
#   MLflow MinIO artifact round-trip
#   Loki
#   OpenTelemetry Collector
#   Grafana
#
# IMPORTANT:
#
# GitHub Actions runs on a clean runner.
#
# The local file:
#
#     .env.docker
#
# does NOT exist there.
#
# CI therefore creates:
#
#     .env.ci
#
# and every Docker Compose command in this workflow uses it.
#
# We intentionally do NOT create a fake production
# @champion in CI.
#
# Part 9 will add proper model/API test fixtures.
# =========================================================


name: PayFlow CI


# =========================================================
# 1. TRIGGERS
# =========================================================

on:

  pull_request:

    branches:
      - main


  push:

    branches:
      - main


  workflow_dispatch:


# =========================================================
# 2. MINIMUM PERMISSIONS
# =========================================================

permissions:

  contents: read


# =========================================================
# 3. CANCEL OBSOLETE RUNS
# =========================================================

concurrency:

  group: payflow-ci-${{ github.ref }}

  cancel-in-progress: true


# =========================================================
# 4. JOBS
# =========================================================

jobs:

  ci:

    name: Validate PayFlow MLOps Platform

    runs-on: ubuntu-latest

    timeout-minutes: 35


    # =====================================================
    # JOB-LEVEL ENVIRONMENT VARIABLES
    #
    # These are host-side URLs because GitHub Actions steps
    # run on the runner host.
    # =====================================================

    env:

      PYTHONPATH: src

      PAYFLOW_DOCKER_MLFLOW_URI:
        http://127.0.0.1:5050

      PAYFLOW_LOKI_URL:
        http://127.0.0.1:3100

      PAYFLOW_GRAFANA_URL:
        http://127.0.0.1:3000

      PAYFLOW_ENV_FILE:
        .env.ci


    steps:

      # ===================================================
      # 5. CHECKOUT
      # ===================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ===================================================
      # 6. DEBUG WORKSPACE
      #
      # Useful while stabilizing the workflow.
      # ===================================================

      - name: Show repository files

        run: |
          echo "Working directory:"
          pwd

          echo
          echo "Repository files:"
          ls -la

          echo
          echo "Docker files:"
          find docker -maxdepth 4 -type f | sort || true

          echo
          echo "Workflow files:"
          find .github -maxdepth 3 -type f | sort || true


      # ===================================================
      # 7. PYTHON SETUP
      # ===================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

          cache-dependency-path: requirements-ci.txt


      - name: Upgrade pip

        run: |
          python -m pip install --upgrade pip


      - name: Install CI dependencies

        run: |
          pip install -r requirements-ci.txt


      # ===================================================
      # 8. CREATE CI ENV FILE
      #
      # This is the critical fix.
      #
      # GitHub runner does NOT have your local .env.docker.
      #
      # These values are temporary CI-only credentials on
      # an ephemeral GitHub-hosted runner.
      # ===================================================

      - name: Create CI environment file

        shell: bash

        run: |
          cat > "${PAYFLOW_ENV_FILE}" <<'EOF'
          # =================================================
          # PAYFLOW AI — CI ONLY
          # =================================================

          POSTGRES_DB=mlflow
          POSTGRES_USER=mlflow
          POSTGRES_PASSWORD=payflow_ci_postgres_12345
          POSTGRES_HOST_PORT=5433

          MINIO_ROOT_USER=payflowci
          MINIO_ROOT_PASSWORD=payflow_ci_minio_12345
          MLFLOW_BUCKET=mlflow
          MINIO_API_PORT=9000
          MINIO_CONSOLE_PORT=9001

          MLFLOW_HOST_PORT=5050
          FASTAPI_HOST_PORT=8001

          GRAFANA_HOST_PORT=3000
          LOKI_HOST_PORT=3100

          OTEL_GRPC_HOST_PORT=4317
          OTEL_HTTP_HOST_PORT=4318

          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=payflow_ci_grafana_12345

          PAYFLOW_TRACE_EXPERIMENT=payflow-production-traces
          PAYFLOW_ENVIRONMENT=ci
          EOF


      # ===================================================
      # 9. VERIFY ENV FILE EXISTS
      # ===================================================

      - name: Verify CI environment file

        run: |
          test -f "${PAYFLOW_ENV_FILE}"

          echo "CI environment file created:"
          ls -l "${PAYFLOW_ENV_FILE}"

          echo
          echo "Variable names:"
          cut -d= -f1 "${PAYFLOW_ENV_FILE}" \
            | grep -v '^#' \
            | grep -v '^$'


      # ===================================================
      # 10. PYTHON SYNTAX VALIDATION
      # ===================================================

      - name: Compile PayFlow Python source

        run: |
          python -m compileall \
            src \
            scripts


      # ===================================================
      # 11. DOCKER VERSION INFO
      # ===================================================

      - name: Show Docker versions

        run: |
          docker --version

          docker compose version


      # ===================================================
      # 12. VALIDATE COMPOSE STRUCTURE
      #
      # This must happen BEFORE build/start.
      # ===================================================

      - name: Validate Docker Compose

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            config \
            --quiet


      # ===================================================
      # 13. SHOW RECOGNIZED SERVICES
      # ===================================================

      - name: Show Compose services

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            config \
            --services


      # ===================================================
      # 14. BUILD PAYFLOW IMAGES
      # ===================================================

      - name: Build Docker images

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            build


      # ===================================================
      # 15. START PART 7 CORE INFRASTRUCTURE
      #
      # We start only:
      #
      #   PostgreSQL
      #   MinIO
      #   MinIO initializer
      #   MLflow
      #
      # FastAPI is intentionally NOT started in CI yet
      # because this disposable Registry has no production
      # @champion.
      # ===================================================

      - name: Start MLflow infrastructure

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            up -d \
            postgres \
            minio \
            minio-init \
            mlflow


      # ===================================================
      # 16. INITIAL STATUS
      # ===================================================

      - name: Show core infrastructure status

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a


      # ===================================================
      # 17. WAIT FOR MLFLOW
      # ===================================================

      - name: Wait for MLflow

        shell: bash

        run: |
          echo "Waiting for MLflow..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:5050/health
            then

              echo
              echo "MLflow is healthy."
              exit 0

            fi

            echo \
              "MLflow not ready yet. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "MLflow did not become healthy."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            mlflow

          exit 1


      # ===================================================
      # 18. MLFLOW STORAGE SMOKE TEST
      #
      # This proves:
      #
      # MLflow metadata -> PostgreSQL
      #
      # MLflow artifacts -> MinIO
      # ===================================================

      - name: Verify PostgreSQL and MinIO through MLflow

        env:

          MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD:
            "false"

          MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD:
            "false"

        run: |
          python scripts/16_test_docker_mlflow.py


      # ===================================================
      # 19. DIRECT POSTGRESQL VERIFICATION
      # ===================================================

      - name: Verify smoke experiment in PostgreSQL

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            exec \
            -T \
            postgres \
            psql \
            -U mlflow \
            -d mlflow \
            -P pager=off \
            -c "
              SELECT
                experiment_id,
                name,
                artifact_location
              FROM experiments
              ORDER BY experiment_id;
            "


      # ===================================================
      # 20. VERIFY SMOKE EXPERIMENT REALLY EXISTS
      # ===================================================

      - name: Assert smoke experiment exists

        shell: bash

        run: |
          RESULT="$(
            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              exec \
              -T \
              postgres \
              psql \
              -U mlflow \
              -d mlflow \
              -t \
              -A \
              -c "
                SELECT name
                FROM experiments
                WHERE name = 'payflow-docker-smoke';
              "
          )"


          echo "Query result: ${RESULT}"


          if [[ "${RESULT}" != *"payflow-docker-smoke"* ]]
          then

            echo \
              "payflow-docker-smoke was not found in PostgreSQL."

            exit 1

          fi


          echo \
            "PostgreSQL MLflow metadata verification passed."


      # ===================================================
      # 21. START OBSERVABILITY INFRASTRUCTURE
      #
      # Loki
      # OpenTelemetry Collector
      # Grafana
      # ===================================================

      - name: Start observability infrastructure

        run: |
          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            up -d \
            loki \
            otel-collector \
            grafana


      # ===================================================
      # 22. WAIT FOR LOKI
      # ===================================================

      - name: Wait for Loki

        shell: bash

        run: |
          echo "Waiting for Loki..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3100/ready
            then

              echo
              echo "Loki is ready."
              exit 0

            fi

            echo \
              "Loki not ready yet. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "Loki did not become ready."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            loki

          exit 1


      # ===================================================
      # 23. WAIT FOR GRAFANA
      # ===================================================

      - name: Wait for Grafana

        shell: bash

        run: |
          echo "Waiting for Grafana..."

          for attempt in {1..90}
          do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/api/health
            then

              echo
              echo "Grafana is healthy."
              exit 0

            fi

            echo \
              "Grafana not ready yet. attempt=${attempt}/90"

            sleep 2

          done


          echo
          echo "Grafana did not become healthy."

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            ps \
            -a

          docker compose \
            --env-file "${PAYFLOW_ENV_FILE}" \
            logs \
            --tail=200 \
            grafana

          exit 1


      # ===================================================
      # 24. CHECK OTEL COLLECTOR CONTAINER
      #
      # The Collector does not need a UI in this CI stage.
      # We verify that its container remains running.
      # ===================================================

      - name: Verify OpenTelemetry Collector

        shell: bash

        run: |
          STATUS="$(
            docker inspect \
              -f '{{.State.Status}}' \
              payflow-otel-collector
          )"


          echo \
            "OpenTelemetry Collector status: ${STATUS}"


          if [[ "${STATUS}" != "running" ]]
          then

            docker logs \
              payflow-otel-collector

            exit 1

          fi


      # ===================================================
      # 25. VERIFY GRAFANA LOKI DATASOURCE
      #
      # Grafana should receive the datasource from:
      #
      # docker/grafana/provisioning/datasources/
      # ===================================================

      - name: Verify Grafana Loki datasource

        shell: bash

        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --user \
            "admin:payflow_ci_grafana_12345" \
            http://127.0.0.1:3000/api/datasources/name/Loki


      # ===================================================
      # 26. FINAL DOCKER STATUS
      # ===================================================

      - name: Show Docker status

        if: always()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              ps \
              -a

          else

            echo \
              "CI env file does not exist; skipping Compose status."

            docker ps \
              -a || true

          fi


      # ===================================================
      # 27. DIAGNOSTICS — POSTGRESQL
      # ===================================================

      - name: Show PostgreSQL logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              postgres || true

          else

            echo \
              ".env.ci missing; PostgreSQL Compose logs unavailable."

          fi


      # ===================================================
      # 28. DIAGNOSTICS — MINIO
      # ===================================================

      - name: Show MinIO logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              minio || true

          else

            echo \
              ".env.ci missing; MinIO Compose logs unavailable."

          fi


      # ===================================================
      # 29. DIAGNOSTICS — MLFLOW
      # ===================================================

      - name: Show MLflow logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              mlflow || true

          else

            echo \
              ".env.ci missing; MLflow Compose logs unavailable."

          fi


      # ===================================================
      # 30. DIAGNOSTICS — LOKI
      # ===================================================

      - name: Show Loki logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              loki || true

          else

            echo \
              ".env.ci missing; Loki Compose logs unavailable."

          fi


      # ===================================================
      # 31. DIAGNOSTICS — OTEL
      # ===================================================

      - name: Show OpenTelemetry logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              otel-collector || true

          else

            echo \
              ".env.ci missing; OTel Compose logs unavailable."

          fi


      # ===================================================
      # 32. DIAGNOSTICS — GRAFANA
      # ===================================================

      - name: Show Grafana logs on failure

        if: failure()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              logs \
              --tail=200 \
              grafana || true

          else

            echo \
              ".env.ci missing; Grafana Compose logs unavailable."

          fi


      # ===================================================
      # 33. CLEANUP
      #
      # GitHub runner is disposable, but explicit cleanup
      # makes the workflow easier to understand.
      # ===================================================

      - name: Stop CI containers

        if: always()

        run: |
          if [[ -f "${PAYFLOW_ENV_FILE}" ]]
          then

            docker compose \
              --env-file "${PAYFLOW_ENV_FILE}" \
              down \
              --remove-orphans || true

          else

            echo \
              "No CI env file; nothing to stop through Compose."

          fi